# Impala Monitor 卸载清单示例
# 复制并修改此文件以匹配您的环境

[impala_nodes]
# 添加需要卸载 Impala Monitor 的节点
# 格式: hostname ansible_host=IP地址 ansible_user=用户名

# 示例配置:
# impala-node1 ansible_host=192.168.1.101 ansible_user=root
# impala-node2 ansible_host=192.168.1.102 ansible_user=root
# impala-node3 ansible_host=192.168.1.103 ansible_user=root

# 如果使用 SSH 密钥认证:
# impala-node1 ansible_host=192.168.1.101 ansible_user=root ansible_ssh_private_key_file=/path/to/key

# 如果使用密码认证 (不推荐):
# impala-node1 ansible_host=192.168.1.101 ansible_user=root ansible_ssh_pass=password

[impala_nodes:vars]
# 全局变量
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# 如果需要使用 sudo
ansible_become=yes
ansible_become_method=sudo

# SSH 连接超时
ansible_ssh_timeout=30
